<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Кадр — кейс</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Newsreader:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#111;--ink:#f2f2f2;--muted:#999;--accent:#f2c94c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Newsreader,serif}
.wrap{max-width:1100px;margin:0 auto;padding:1.25rem}
nav{display:flex;justify-content:space-between;padding:1rem 0;border-bottom:1px solid #2a2a2a}
.logo{font-family:Syne,sans-serif;font-weight:700;letter-spacing:-.03em}
a{color:var(--muted);text-decoration:none}a:hover{color:var(--accent)}
h1{font-family:Syne,sans-serif;font-size:clamp(3rem,9vw,6rem);letter-spacing:-.05em;line-height:.92;margin:3rem 0 1rem}
.grid{display:grid;gap:.75rem;grid-template-columns:1.4fr 1fr;padding-bottom:3rem}
.ph{min-height:220px;background:linear-gradient(145deg,#2a2a2a,#171717 40%,#f2c94c22)}
.ph:nth-child(2){background:linear-gradient(145deg,#1c1c1c,#0f0f0f 50%,#8882)}
.ph:nth-child(3){grid-column:1/-1;min-height:180px;background:linear-gradient(90deg,#222,#111 40%,#f2c94c33)}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<nav><div class="logo">КАДР</div><a href="../">← Соломичев Иван</a></nav>
<h1>Свет.<br/>Тень.<br/>Кадр.</h1>
<p style="color:var(--muted);max-width:36ch">Портфолио фотографа: крупная типографика, сетка кадров, минимум UI-шума. Заказчик сразу чувствует уровень.</p>
<p style="margin:1.5rem 0"><a href="../#contact" style="color:var(--accent)">Обсудить проект →</a></p>
<div class="grid"><div class="ph"></div><div class="ph"></div><div class="ph"></div></div>
</div>
</body>
</html>
