<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Йога Рассвет — кейс</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f7f3ec;--ink:#2a241c;--muted:#7a7166;--accent:#2f6f5e;--line:#e5ddd0}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f3ec,#efe6d8);color:var(--ink);font-family:Figtree,sans-serif;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:1.25rem}
nav{display:flex;justify-content:space-between;padding:1rem 0}
a{color:var(--muted);text-decoration:none}a:hover{color:var(--accent)}
.logo{font-family:Fraunces,serif;font-weight:700}
h1{font-family:Fraunces,serif;font-size:clamp(2.8rem,7vw,4.5rem);line-height:1.05;margin:3rem 0 1rem;max-width:12ch}
p{color:var(--muted);max-width:40ch;line-height:1.65}
.btn{display:inline-block;margin:1.4rem 0 2.5rem;border:1.5px solid var(--ink);padding:.85rem 1.2rem;text-decoration:none;color:var(--ink);font-weight:600;border-radius:999px}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.cards{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding-bottom:3rem}
.card{background:#fff8;border:1px solid var(--line);border-radius:1.25rem;padding:1.2rem}
</style>
</head>
<body>
<div class="wrap">
<nav><div class="logo">Йога Рассвет</div><a href="../">← Соломичев Иван</a></nav>
<h1>Утро начинается с дыхания</h1>
<p>Wellness-лендинг: мягкая палитра, спокойный ритм, запись на занятие. Не «крем + терракота шаблон», а свой характер студии.</p>
<a class="btn" href="../#contact">Обсудить лендинг</a>
<div class="cards">
  <div class="card"><strong>Хатха</strong><p>60 мин · новички</p></div>
  <div class="card"><strong>Виньяса</strong><p>75 мин · поток</p></div>
  <div class="card"><strong>Йога-нидра</strong><p>45 мин · восстановление</p></div>
</div>
</div>
</body>
</html>
