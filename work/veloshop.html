<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Veloshop Trail — кейс</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0b0d;--ink:#f5f5f5;--muted:#9b9ba3;--accent:#ff5a1f;--card:#15151a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:1.25rem}
nav{display:flex;justify-content:space-between;padding:1rem 0;border-bottom:2px solid #222}
.logo{font-family:"Bebas Neue",sans-serif;font-size:2rem;letter-spacing:.04em}
a{color:var(--muted);text-decoration:none}a:hover{color:var(--accent)}
h1{font-family:"Bebas Neue",sans-serif;font-size:clamp(3.5rem,10vw,7rem);line-height:.9;margin:2.5rem 0 1rem;letter-spacing:.02em}
.lead{max-width:40ch;color:var(--muted)}
.btn{display:inline-block;margin:1.2rem 0 2rem;background:var(--accent);color:#fff;padding:.85rem 1.1rem;font-weight:600;text-decoration:none}
.shop{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding-bottom:3rem}
.card{background:var(--card);border:1px solid #222;padding:1rem}
.price{color:var(--accent);font-weight:600;margin-top:.6rem}
.swatch{height:120px;margin-bottom:.8rem;background:linear-gradient(135deg,#2a2a32,#1a1a20 50%,#ff5a1f33)}
</style>
</head>
<body>
<div class="wrap">
<nav><div class="logo">VELOSHOP TRAIL</div><a href="../">← Соломичев Иван</a></nav>
<h1>ВЕЛОСИПЕДЫ<br/>ДЛЯ ГОРОДА<br/>И ГРЯЗИ</h1>
<p class="lead">Интернет-магазин: сетка каталога, карточки, корзина-симулятор. Жёсткий спортивный характер без шаблонной «фиолетовой» эстетики.</p>
<a class="btn" href="../#contact">Обсудить магазин</a>
<div class="shop">
  <div class="card"><div class="swatch"></div><strong>Trail X1</strong><div class="price">89 900 ₽</div></div>
  <div class="card"><div class="swatch" style="background:linear-gradient(135deg,#1e2a22,#111,#ff5a1f44)"></div><strong>City Flex</strong><div class="price">54 500 ₽</div></div>
  <div class="card"><div class="swatch" style="background:linear-gradient(135deg,#221a16,#111,#ff5a1f55)"></div><strong>Enduro Pro</strong><div class="price">121 000 ₽</div></div>
</div>
</div>
</body>
</html>
