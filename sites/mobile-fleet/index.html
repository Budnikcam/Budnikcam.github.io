<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fleet Mobile — полевое приложение</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#eef2ff;--ink:#111827;--muted:#6b7280;--acc:#4f46e5;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:"Plus Jakarta Sans",sans-serif;background:linear-gradient(180deg,#e0e7ff,var(--bg));color:var(--ink);min-height:100vh}
a{color:inherit;text-decoration:none}.page{max-width:420px;margin:0 auto;padding:1.2rem}
.phone{background:var(--card);border-radius:2rem;box-shadow:0 25px 60px rgba(79,70,229,.18);overflow:hidden;border:1px solid #e5e7eb}
.notch{height:1.4rem;background:#111;border-radius:0 0 1rem 1rem;width:40%;margin:0 auto}
.head{padding:1.1rem 1.2rem .6rem;display:flex;justify-content:space-between;align-items:center}
.head b{font-size:1.05rem}
.list{padding:0 1rem 1.2rem;display:grid;gap:.7rem}
.task{border:1px solid #e5e7eb;border-radius:1rem;padding:.9rem}
.task .tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--acc);background:#eef2ff;padding:.2rem .5rem;border-radius:999px;margin-bottom:.35rem}
.task h3{margin:0 0 .25rem;font-size:.98rem}.task p{margin:0;color:var(--muted);font-size:.86rem}
.bar{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #e5e7eb;padding:.75rem;text-align:center;font-size:.78rem;color:var(--muted)}
.bar .on{color:var(--acc);font-weight:700}
.back{display:inline-block;margin:1rem 0;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="page">
  <a class="back" href="../../">← Портфолио</a>
  <div class="phone">
    <div class="notch"></div>
    <div class="head"><b>Fleet Mobile</b><span style="color:var(--muted);font-size:.85rem">Сегодня</span></div>
    <div class="list">
      <article class="task"><span class="tag">В работе</span><h3>Объект «Север-14»</h3><p>Проверить оборудование · до 14:30</p></article>
      <article class="task"><span class="tag">Новая</span><h3>Заявка #2891</h3><p>Выезд · ул. Ленина, 8</p></article>
      <article class="task"><span class="tag">Готово</span><h3>Акт выполнен</h3><p>Подпись получена · 11:20</p></article>
    </div>
    <div class="bar"><span class="on">Задачи</span><span>Карта</span><span>Профиль</span></div>
  </div>
  <p style="color:var(--muted);margin:1.2rem 0 2rem;font-size:.92rem">Мобильный / PWA-кабинет для полевых команд: задачи, статусы, офлайн-ready интерфейс.</p>
</div>
</body>
</html>
